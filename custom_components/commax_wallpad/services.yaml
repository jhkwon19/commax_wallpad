# services.yaml은 개발자 도구와 자동화 편집기에 표시할 서비스 설명이다.
# 실제 서비스 등록과 실행 코드는 __init__.py에 있다.
fast_poll:
  name: Fast-poll elevator
  description: >-
    Temporarily switch the elevator floor/direction sensors to 1-second
    polling (normally 30s). Use it manually only when the wallpad is not also
    tracking the elevator. It reverts to the normal rate once the car has been
    idle for a few seconds, or after 2 minutes.
  fields: {}
